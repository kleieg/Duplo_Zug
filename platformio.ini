; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Serial port: auto-detected. To force one, pass it on the command line, e.g.
;   pio run -t upload --upload-port /dev/cu.usbmodem1101
;   pio device monitor --port /dev/cu.usbmodem1101

[platformio]
lib_dir = lib

; Settings shared by all environments
[env]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
upload_protocol = esptool
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    fastled/FastLED@^3.6.0
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Train controller firmware
[env:esp32-s3-fh4r2]
build_flags =
    ${env.build_flags}
    -Iinclude
    -Ilib
    -Ilib/Legoino/src
    -Ilib/NimBLE-Arduino/src
build_src_filter =
    +<*>
    -<diagnostics/>

; Diagnostics: raw button/encoder input monitor
[env:esp32-s3-input-monitor]
build_src_filter =
    -<*>
    +<diagnostics/InputMonitor.cpp>
